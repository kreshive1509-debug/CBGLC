services:
  - type: web
    name: cbgl-api
    rootDir: .
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        value: https://cbglc.vercel.app
      - key: APP_URL
        value: https://cbglc.vercel.app
      - key: CORS_ORIGIN
        value: https://cbglc.vercel.app
